name: One-time Phase 6 source-to-IR runtime asset synchronization
on:
  push:
    branches: [feat/phase6-preserve-historical-heart-morphology-in-ir-20261031]
    paths:
      - '.github/workflows/adhoc-source-ir-runtime-sync.yml'
permissions:
  contents: write
jobs:
  sync_runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update content-addressed website script hashes without changing generated source
        run: |
          python tools/build_runtime_assets.py --write
          python tools/build_runtime_assets.py --check
          git status --short
          git add index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: refresh source-to-IR browser runtime asset hashes'
          git push origin HEAD:feat/phase6-preserve-historical-heart-morphology-in-ir-20261031
