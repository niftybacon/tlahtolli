name: One-time zan source English, browser and versioned runtime sync
on:
  push:
    branches:
      - feat/phase6-zan-source-english-20261031
    paths:
      - '.github/workflows/adhoc-zan-runtime-sync.yml'
permissions:
  contents: write
jobs:
  validate_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute zan source English and existing yehua/Brinton regressions
        run: |
          node tools/test_phase6_zan_english_options.js
          node tools/test_phase6_yehua_english_options.js
          node tools/test_source_bound_possessives.js
          node tools/test_phase6_source_morphology_ir_observations.js
      - name: Install real browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium --only-shell
      - name: Check zan and old yehua in actual Tēntli desk
        run: |
          python tools/test_phase6_zan_english_browser.py
          python tools/test_phase6_yehua_english_browser.py
      - name: Sync website runtime identifiers for all changed scripts
        run: |
          python tools/build_runtime_assets.py --write
          python tools/build_runtime_assets.py --check
          git status --short
          git add index.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: regenerate versioned zan bilingual public translator runtime'
            git push origin HEAD:feat/phase6-zan-source-english-20261031
          fi
