name: Check Tlahtōlli data
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated dictionary outputs
        run: python tools/build_dictionary.py --check
      - name: Check source-controlled morphology-engine embed
        run: python tools/build_morphology_engine.py --check
      - name: Test Phase 2 source separation
        run: python tools/test_phase2.py
      - name: Validate published dictionary
        run: python tools/validate.py
      - name: Expansion 01 lexical source and safety regressions
        run: python tools/test_expansion01.py
      - name: Regression checks on known documented forms
        run: python tools/test_data.py
      - name: Audit claim-level source coverage
        run: python tools/test_claim_audit.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self):super().__init__();self.inside=False;self.scripts=[]
              def handle_starttag(self,t,a):
                  if t=='script':self.inside=True;self.scripts.append('')
              def handle_endtag(self,t):
                  if t=='script':self.inside=False
              def handle_data(self,d):
                  if self.inside:self.scripts[-1]+=d
          h=P();h.feed(Path('index.html').read_text(encoding='utf8'))
          Path('/tmp/tlahtolli-app.js').write_text(h.scripts[-1],encoding='utf8')
          PY
          node --check /tmp/tlahtolli-app.js
      - name: Install headless browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium --only-shell
      - name: "Advanced morphology: indexed and productive parse regressions"
        run: python tools/test_advanced_morphology.py
      - name: Phase 4 historical-source and morpheme regressions
        run: python tools/test_phase4.py
      - name: Run browser regressions
        run: python tools/browser_smoke.py
      - name: Phase 3 scalable search and result-list parity
        run: python tools/test_phase3.py
      - name: Verify evidence ledger in browser
        run: python tools/test_claim_browser.py
      - name: Test cited token annotations and export safety
        run: python tools/test_interlinear.py
      - name: Validate source catalog and historical variety annotations
        run: python tools/test_references_schema.py
      - name: Check reference atlas and bounded morphological hypotheses
        run: python tools/test_references.py
