name: Check Tlahtōlli data
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated dictionary outputs
        run: python tools/build_dictionary.py --check
      - name: Check source-controlled SRS embed
        run: python tools/build_srs.py
      - name: Check source-controlled morphology-engine embed
        run: python tools/build_morphology_engine.py --check
      - name: Test Phase 2 source separation
        run: python tools/test_phase2.py
      - name: Validate published dictionary
        run: python tools/validate.py
      - name: Regression checks on known documented forms
        run: |
          python tools/test_data.py
          python tools/test_audit_repairs.py
          python tools/test_refresh_luke_review.py
          python tools/test_remaining_audit.py
      - name: Audit claim-level source coverage
        run: python tools/test_claim_audit.py
      - name: Validate imported Amoxcalli lexical archive and script syntax
        run: |
          python tools/test_amoxcalli_archive.py
          node --check amoxcalli-archive.js
          node --check translator-integrated.js
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self):super().__init__();self.inside=False;self.scripts=[]
              def handle_starttag(self,t,a):
                  if t=='script':self.inside=True;self.scripts.append('')
              def handle_endtag(self,t):
                  if t=='script':self.inside=False
              def handle_data(self,d):
                  if self.inside:self.scripts[-1]+=d
          h=P();h.feed(Path('index.html').read_text(encoding='utf8'))
          Path('/tmp/tlahtolli-app.js').write_text(h.scripts[-1],encoding='utf8')
          PY
          node --check /tmp/tlahtolli-app.js
      - name: Validate Classical Nahuatl translation corpus permissions and splits
        run: python tools/validate_translation_corpus.py
      - name: Test source-aware translation engine
        run: node tools/test_translator.js
      - name: Test compositional English and complete passage coverage
        run: node tools/test_english_composition.js
      - name: Declarative grammar and indexed morphology regressions
        run: node tools/test_declarative_grammar.js && node tools/test_morphology_clause_bridge.js
      - name: Source-located possessed noun and agreement tests
        run: node tools/test_possessed_agreement.js
      - name: Test lexical ambiguity and vowel-length abstention
        run: node tools/test_translation_abstention.js
      - name: Test historical spelling and morphology bridge
        run: node tools/test_translator_morphology.js
      - name: Test all-twelve-book Codex research aggregation
        run: python tools/test_florentine_analysis.py
      - name: Verify preliminary Codex readings cannot be mislabelled as training data
        run: |
          python tools/validate_codex_close_reading.py
          node --check codex-close-reading.js
          node --check codex-facsimile-review.js
          node --check codex-double-pass.js
          node --check codex-context-bridge.js

      - name: Test conservative 1833 Luke OCR correction and segmentation
        run: python tools/test_luke_ocr.py
      - name: Check original-page chapter numbering claims remain appropriately limited
        run: python tools/test_luke_chapter_verification.py
      - name: Test FSRS Stage 1 and Stage 2 engine
        run: node tools/test_fsrs.js
      - name: Install headless browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium --only-shell
      - name: Integrated translator browser and tab regression
        run: python tools/test_translator_browser.py
      - name: Compositional English browser choices and failure isolation
        run: python tools/test_english_composition_browser.py
      - name: Morphology-assisted clause browser regression
        run: python tools/test_morphology_clause_browser.py
      - name: Test expanded Amoxcalli archive search and cautious translator fallback
        run: python tools/test_amoxcalli_browser.py
      - name: Test Florentine Codex grammar reader and manuscript verification safeguards
        run: python tools/test_codex_close_reading_browser.py
      - name: Test independent two-pass manuscript collation and safe export
        run: python tools/test_codex_double_pass_browser.py
      - name: Advanced SRS and Anki export browser regressions
        run: python tools/test_srs.py
      - name: Expansion 01 lexical source and safety regressions
        run: python tools/test_expansion01.py
      - name: Amoxtli expansion 02 source, tokens and migration regressions
        run: python tools/test_amoxtli_expansion02.py
      - name: SRS v3 browser and Anki interoperability regressions
        run: python tools/test_srs_v3.py
      - name: "Advanced morphology: indexed and productive parse regressions"
        run: python tools/test_advanced_morphology.py
      - name: Phase 4 historical-source and morpheme regressions
        run: python tools/test_phase4.py
      - name: Run browser regressions
        run: python tools/browser_smoke.py
      - name: Phase 3 scalable search and result-list parity
        run: python tools/test_phase3.py
      - name: Verify evidence ledger in browser
        run: python tools/test_claim_browser.py
      - name: Test cited token annotations and export safety
        run: python tools/test_interlinear.py
      - name: Validate source catalog and historical variety annotations
        run: python tools/test_references_schema.py
      - name: Check reference atlas and bounded morphological hypotheses
        run: python tools/test_references.py

