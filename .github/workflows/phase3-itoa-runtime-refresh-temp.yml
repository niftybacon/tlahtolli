# One-time branch-local maintenance; remove after generating the oversized offline index.
name: Phase3 itoa runtime hash refresh temporary
on:
  push:
    branches:
      - feat/phase3-source-graded-negative-indefinite-20261030
    paths:
      - '.github/workflows/phase3-itoa-runtime-refresh-temp.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'niftybacon/tlahtolli'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate official content hashes using existing Python builder
        run: python tools/build_runtime_assets.py --write
      - name: Commit only generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          if git diff --cached --quiet; then
            echo "No runtime cache manifest changes"
          else
            git commit -m "build: refresh Phase 3 source-graded itoa browser assets"
            git push origin HEAD:feat/phase3-source-graded-negative-indefinite-20261030
          fi
