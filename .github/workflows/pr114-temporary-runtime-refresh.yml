# TEMPORARY branch-only maintenance workflow; delete after asset refresh.
# Second pass: refresh after evidence-pack-wide tamper-guard regression fix.
name: PR114 temporary runtime asset regeneration
on:
  push:
    branches:
      - research/phase6-attested-ayac-scope-20261030
    paths:
      - '.github/workflows/pr114-temporary-runtime-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'niftybacon/tlahtolli'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recompute content-addressed browser runtime (same canonical builder)
        run: python tools/build_runtime_assets.py --write
      - name: Commit generated index only, never source or models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          if git diff --cached --quiet; then
            echo "Index already synchronized"
          else
            git commit -m "build: refresh PR114 content-addressed browser runtime"
            git push origin HEAD:research/phase6-attested-ayac-scope-20261030
          fi
