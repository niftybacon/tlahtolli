# Temporary branch-scoped workflow for an oversized generated offline HTML index.
# Remove from the branch after its one-time canonical cache refresh.
name: PR115 temporary runtime hash refresh
on:
  push:
    branches:
      - feat/phase3-source-graded-negative-indefinite-20261030
    paths:
      - '.github/workflows/pr115-runtime-refresh-temp.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'niftybacon/tlahtolli'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update official content-addressed browser runtime keys
        run: python tools/build_runtime_assets.py --write
      - name: Commit only generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          if git diff --cached --quiet; then
            echo "Generated index already synchronized"
          else
            git commit -m "build: synchronize Phase 3 source-graded grammar browser assets"
            git push origin HEAD:feat/phase3-source-graded-negative-indefinite-20261030
          fi
