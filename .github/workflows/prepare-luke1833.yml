name: Prepare 1833 Luke OCR correction review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/clean_segment_luke1833.py
      - .github/workflows/prepare-luke1833.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download public-domain historical edition and prepare draft
        run: python tools/clean_segment_luke1833.py --download-archive
      - name: Verify provenance and unreviewed statuses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('research/translation_corpus')
          r=json.loads((base/'luke_1833_review_queue.json').read_text(encoding='utf8'))
          source=(base/'luke_1833_working_ocr.txt').read_text(encoding='utf8')
          assert r['format']=='tlahtolli-luke1833-ocr-segmentation'
          assert not r['training_approved'] and not r['specialist_reviewed']
          assert len(source)>100000
          assert r['counts'].get('applied_hyphen',0)>0
          assert r['counts'].get('verse_start_candidates',0)>10
          assert all(item.get('source_review_required') is True for item in r['review_queue'])
          print('Draft OCR preparation validated:',r['counts'])
          PY
      - name: Commit public-domain working OCR and provenance-rich review queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/translation_corpus/luke_1833_working_ocr.txt research/translation_corpus/luke_1833_review_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepare 1833 Luke working OCR and candidate verse/correction review queue"
            git push
          fi
