name: Probe Temoa Chimalpahin manuscript source structure
on:
  push:
    branches: [feat/temoa-chimalpahin-long-prose-20261029]
    paths: ['tools/probe_temoa_structure.py', '.github/workflows/temoa-structure-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/probe_temoa_structure.py
