# Temporary branch-scoped canonical runtime-asset refresh; delete after use.
name: Temporary Phase3 content-comparator runtime sync
on:
  push:
    branches:
      - feat/phase3-source-graded-negative-indefinite-20261030
    paths:
      - '.github/workflows/temp-phase3-argument-asset-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'niftybacon/tlahtolli'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh canonical browser script content hashes
        run: python tools/build_runtime_assets.py --write
      - name: Commit generated index cache only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          if git diff --cached --quiet; then
            echo "Index already synchronized"
          else
            git commit -m "build: synchronize documented Phase 3 source-content browser runtime"
            git push origin HEAD:feat/phase3-source-graded-negative-indefinite-20261030
          fi
