name: Brinton 1890 weak bilingual learning (research only)
on:
  pull_request:
    paths:
      - 'research/neural_training/brinton_1890_poetry_weak_en.jsonl'
      - 'research/neural_training/BRINTON_1890_WEAK_ENGLISH.md'
      - 'tools/test_brinton_weak_parallel.py'
      - '.github/workflows/tentli-brinton-weak-parallel.yml'
  push:
    paths:
      - 'research/neural_training/brinton_1890_poetry_weak_en.jsonl'
      - 'research/neural_training/BRINTON_1890_WEAK_ENGLISH.md'
      - 'tools/test_brinton_weak_parallel.py'
      - '.github/workflows/tentli-brinton-weak-parallel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-historical-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve candidate/rights/split boundaries
        run: |
          python -m unittest discover -s tools -p 'test_brinton_weak_parallel.py' -v
          python -m unittest discover -s tools -p 'test_historical_neural_corpus.py' -v
          python tools/validate_translation_corpus.py
  experimental-weak-gradient-steps:
    needs: verify-historical-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch CPU
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2,<3'
      - name: Run 40 real, bounded updates from historical candidate translations (not gold)
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -m neural.train \
            --manifest research/neural_training/brinton_1890_poetry_weak_en.jsonl \
            --output /tmp/tentli-brinton-weak-40 \
            --epochs 4 --batch-size 4 --max-steps 40
          python - <<'PY'
          import json
          with open('/tmp/tentli-brinton-weak-40/metadata.json', encoding='utf-8') as fh:
              m = json.load(fh)
          assert m['steps'] == 40
          assert m['trained_translation_examples'] == 133
          assert m['independent_translation_accuracy'] is None
          assert m['source_inventory']['candidate_parallel_training_records'] == 133
          assert m['initialization'] == 'random'
          print('Research training metadata verified. No verified translation accuracy or deployed model.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tentli-brinton-1890-weak-stanza-40step-research-only
          path: /tmp/tentli-brinton-weak-40/
          retention-days: 30
          if-no-files-found: error
