name: One-time PR106 cache-asset manifest refresh
on:
  push:
    branches:
      - codex/unresolved-928-provenance-triage-20261030
    paths:
      - '.github/workflows/tentli-pr106-refresh-runtime-assets.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'niftybacon/tlahtolli' && github.ref == 'refs/heads/codex/unresolved-928-provenance-triage-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute original content-versioned index.html loader URLs without editing other files
        run: |
          python tools/build_runtime_assets.py --write
          python tools/build_runtime_assets.py --check
          git add -- index.html
          if git diff --cached --quiet; then
            echo 'Runtime manifest already up to date'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update runtime browser hashes after contextual poetic grammar integration'
            git push origin HEAD:codex/unresolved-928-provenance-triage-20261030
          fi
