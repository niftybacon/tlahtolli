name: Tēntli pretrained English and reviewed-feedback learner
on:
  push:
    branches: [feat/tentli-pretrained-english-reviewed-loop-20261029]
    paths:
      - 'neural/pretrained_english.py'
      - 'neural/correction_queue.py'
      - 'neural/train_reviewed_english.py'
      - 'neural/grammar_teacher_practice.py'
      - 'neural/hybrid_infer.py'
      - 'tools/test_pretrained_english_review_loop.py'
      - '.github/workflows/tentli-pretrained-reviewed-learning.yml'
      - 'research/translation_corpus/pairs.csv'
  workflow_dispatch:
  schedule:
    - cron: "41 14 * * *"
permissions:
  contents: read
jobs:
  research-review-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify no feedback becomes approved training or false gold
        run: |
          python -m unittest discover -s tools -p 'test_pretrained_english_review_loop.py' -v
          python tools/validate_translation_corpus.py
          python -m neural.train_reviewed_english --audit-only
      - name: Summarize unresolved problems without promoting any examples
        run: |
          python -m neural.correction_queue report --threshold 40
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          from neural.correction_queue import summarize
          from tools.validate_translation_corpus import check_records
          current=summarize(Path("research/translation_corpus/correction_queue.jsonl"),40)
          errors,counts=check_records()
          assert not errors
          print("## Tēntli recurring linguistic problems")
          print("This is a recurring *audit*, not an automated weight update or an approval of manuscript text.")
          print("- Distinct pending feedback: "+str(current['total_distinct_inputs']))
          print("- Approved human-reviewed bilingual pairs in existing corpus: "+str(counts['approved']))
          print("- Source-work/failure-category combinations with at least 40 distinct examples: "+str(len(current['recurring_problems'])))
          for case in current['recurring_problems'][:12]:
              print(f"- {case['work_id']}: {case['failure_category']} ({case['distinct_attested_inputs']} distinct inputs), requires research review")
          print("- Autonomous training, gold promotion and rule changes: **disabled**")
          PY
  optional-pretrained-live-probe:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original PyTorch CPU
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2,<3'
      - name: Install pinned Transformers and lightweight supervised adaptation library
        run: python -m pip install 'transformers==4.46.3' 'peft==0.13.2' sentencepiece safetensors
      - name: Run the real Apache-2.0 pretrained English decoder on audited grammatical input
        run: |
          python - <<'PY'
          import json
          from neural.pretrained_english import pretrained_english,MODEL_ID,MODEL_REVISION,FlanEnglishDecoder
          from neural.hybrid_infer import infer_hybrid
          decoder=FlanEnglishDecoder()
          assert MODEL_ID=="google/flan-t5-small"
          assert decoder.model.config.is_encoder_decoder
          assert sum(p.numel() for p in decoder.model.parameters())>50_000_000
          result=[]
          for nahuatl,expected in [('nichōca','I cry.'),('nitlacua','I eat.'),
                                   ('niquitta in cihuātl','I see the woman.')]:
              x=pretrained_english(nahuatl,decoder=decoder)
              assert x["english"] in {z["english"] for z in infer_hybrid(nahuatl)["candidates"]}
              assert x["english"] and x["verified_translation"] is False
              assert x["pretrained_model"]["revision"]==MODEL_REVISION
              result.append({"source":nahuatl,"english":x["english"],
                             "candidate_status":x["status"],
                             "raw_pretrained_suggestion":x["model_proposal"]})
              print("PRETRAINED_ENGLISH_ACTUAL_RESULT",json.dumps(result[-1],ensure_ascii=False))
          nonsense=pretrained_english('xyzzy',decoder=decoder)
          assert nonsense["status"]=="abstain" and nonsense["english"] is None
          print("REAL_PRETRAINED_ENGLISH_CHECKPOINT_LOADED_AND_GATED",json.dumps({
              "model":MODEL_ID,"revision":MODEL_REVISION,
              "params":sum(p.numel() for p in decoder.model.parameters()),
              "supported_examples":len(result),"unknown_abstained":True,
              "human_translation_accuracy":None},ensure_ascii=False))
          PY
      - name: Prove synthetic training fixture can update LoRA weights, but do not publish them as gold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from tools.test_pretrained_english_review_loop import TestApprovalGate
          from neural.train_reviewed_english import supervised_adapt
          # Explicitly synthetic unittest fixture; not an approved
          # historical sentence or a genuine reviewed correction.
          with TemporaryDirectory() as folder:
              file=Path(folder)/"test-only-pairs.csv"
              t=TestApprovalGate()
              t.write(file,[t.approved_pair(1,"train","test-source-A"),
                            t.approved_pair(2,"dev","test-source-B")])
              result=supervised_adapt(file,Path(folder)/"throwaway-adapter",max_steps=1)
              assert result["actual_optimizer_steps"]==1
              assert result["training_rows"]==result["development_rows"]==1
              assert result["automatically_approved_for_public_translation"] is False
              assert (Path(folder)/"throwaway-adapter"/"adapter_model.safetensors").exists()
              print("SYNTHETIC_FIXTURE_SUPERVISED_UPDATE_NOT_HISTORICAL_TRAINING",json.dumps({
                  "actual_steps":result["actual_optimizer_steps"],
                  "provenance":"synthetic_regression_fixture_not_reviewed_source",
                  "production_weights_modified":False}))
          PY
      - name: Export ONLY source-linked canonical synthetic teacher English curriculum
        run: |
          node tools/export_tentli_neural_teacher.js "$RUNNER_TEMP/tentli-teacher.jsonl"
          python -m neural.grammar_teacher_practice \
            --teacher-manifest "$RUNNER_TEMP/tentli-teacher.jsonl" --audit-only
      - name: Actually train a PRIVATE English LoRA adapter on source-gated SYNTHETIC grammar exercises
        run: |
          python -m neural.grammar_teacher_practice \
            --teacher-manifest "$RUNNER_TEMP/tentli-teacher.jsonl" \
            --output "$RUNNER_TEMP/teacher-english-adapter" --steps 24
          python - <<'PY'
          import os,pathlib,json
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"teacher-english-adapter"
          m=json.loads((folder/"research_metadata.json").read_text(encoding="utf-8"))
          assert m["evidence_tier"]=="synthetic_grammar_teacher"
          assert m["actual_optimizer_steps"]==24
          assert m["training_rows"]>0 and m["development_rows"]>0
          assert m["human_reviewed_training_examples"]==0
          assert m["historically_attested_sentence_translations_added"]==0
          assert m["independent_translation_accuracy"] is None
          assert (folder/"adapter_model.safetensors").is_file()
          print("SYNTHETIC_TEACHER_ENGLISH_PRACTICE_COMPLETED",json.dumps({
              "steps":m["actual_optimizer_steps"],
              "synthetic_train":m["training_rows"],
              "synthetic_dev":m["development_rows"],
              "dev_loss_before":m["dev_teacher_forced_loss_before"],
              "dev_loss_after":m["dev_teacher_forced_loss_after"],
              "training_class":"synthetic_only_not_historical_reviewed"},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tentli-pretrained-english-synthetic-teacher-private-research
          path: |
            ${{ runner.temp }}/teacher-english-adapter/adapter_model.safetensors
            ${{ runner.temp }}/teacher-english-adapter/adapter_config.json
            ${{ runner.temp }}/teacher-english-adapter/research_metadata.json
          retention-days: 30
          if-no-files-found: error
