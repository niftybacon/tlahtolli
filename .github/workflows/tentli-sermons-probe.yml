name: Probe Sahagun manuscript HTML structure
on:
  push:
    branches: [feat/tentli-sahagun-sermons-ayer1485-20261029]
    paths:
      - 'tools/probe_ayer1485_dom.py'
      - '.github/workflows/tentli-sermons-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/probe_ayer1485_dom.py
