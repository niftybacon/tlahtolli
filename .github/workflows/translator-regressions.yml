permissions:
  contents: read

jobs:
  translation-evidence:
    name: Lexicon, morphology and sentence tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Translator CI trigger and duplicate-step integrity
        run: python tools/test_translator_workflow_integrity.py
      - name: Manuscript reading aid JavaScript syntax
        run: node --check manuscript-reading-desk.js
      - name: Parallel reading desk JavaScript syntax
        run: node --check parallel-reading-core.js && node --check parallel-reading-desk.js
      - name: Personal parallel text and manual-only alignment regressions
        run: node tools/test_parallel_reading.js
      - name: Curated lexical and passage regressions
        run: node tools/test_translator.js
      - name: Sentence grammar regressions
        run: node tools/test_translator_sentence.js
      - name: Declarative construction rule coverage
        run: node tools/test_declarative_grammar.js
      - name: Indexed morphology to clause bridge tests
        run: node tools/test_morphology_clause_bridge.js
      - name: Canonical Tēntli regular singular present hypotheses
        run: node tools/test_regular_present_morphology.js
      - name: Canonical source-bound possessed noun morphology
        run: node tools/test_source_bound_possessives.js
      - name: Canonical source-located finite verb morphology
        run: node tools/test_source_verb_productivity.js
      - name: Canonical source-checked long/short verb stem productivity
        run: node tools/test_source_stem_class_morphology.js
      - name: Canonical source-backed plural future/preterite morphology
        run: node tools/test_source_stem_plural_morphology.js
      - name: Source-checked Classical present-plural hypotheses
        run: node tools/test_source_present_plural_morphology.js
      - name: Source-located batch 03 lexical stem and morphology regressions
        run: node tools/test_curated_verb_expansion03.js && node tools/test_index_verb_source_review.js && node tools/test_batch04_verb_class_evidence.js && node tools/test_verified_class2_refinement.js
      - name: Exact possessed noun and person agreement safeguards
        run: node tools/test_possessed_agreement.js
      - name: Exact possessed noun heads in constrained Classical in-relatives
        run: node tools/test_possessed_relative_heads.js
      - name: Source-linked morphology bridge syntax and provenance regressions
        run: node --check translator-source-morphology.js && node tools/test_source_morphology.js
      - name: Classical Nahuatl source-linked comparative fragment regressions
        run: node tools/test_contextual_fragments.js
      - name: Classical relational noun and locative evidence regressions
        run: node --check translator-locative.js && node tools/test_locative_relations.js
      - name: Source-grounded finite-locative clauses and explicit context regressions
        run: node --check translator-sentence.js && node tools/test_complex_locative_clauses.js
      - name: Classical overt coordination and bounded conditional syntax
        run: node tools/test_multiclause_syntax.js
      - name: Classical in relatives, subordinate predicates and antecedent constraints
        run: node --check translator-sentence.js && node tools/test_relative_in_antecedents.js
      - name: Nested in-clauses, discourse mentions and possessed relative heads
        run: node tools/test_translator_nested_in_discourse.js && node tools/test_nested_possessed_relatives.js && node tools/test_subordinate_clause_arguments.js
      - name: Shared grammatical IR nested possessed discourse integrity
        run: node --check translator-grammar-ir.js && node tools/test_shared_grammar_ir.js
      - name: Existing English composition checked against IR grammatical alternatives
        run: node tools/test_ir_audited_english.js
      - name: Agreement-aware graph role and discourse scope refusals
        run: node tools/test_grammar_ir_agreement_audit.js
      - name: Archive form evidence and morphology cross-check regressions
        run: node tools/test_archive_lexical.js
      - name: Translation quality readiness and independent-holdout checks
        run: node tools/test_translation_readiness.js
      - name: Published Axolotl parallel pair pointer integrity (no copied gold)
        run: node --check tools/inspect_axolotl_candidates.js && node tools/test_axolotl_pair_pointers.js
      - name: Axolotl development diagnostics fixture and no-score safeguards
        run: node --check tools/diagnose_axolotl_development.js && node tools/test_axolotl_development.js
      - name: Real pinned Axolotl source grammar/lexical failure inventory
        run: |
          curl --fail --location --show-error --silent --retry 2 --connect-timeout 12 --max-time 90 \
            "https://raw.githubusercontent.com/ElotlMX/py-elotl/157f34300f4ca92c3d75b74ec14142916d75c30b/elotl/corpora/axolotl.csv" \
            --output "$RUNNER_TEMP/tlahtolli-axolotl-source.csv"
          node tools/diagnose_axolotl_development.js "$RUNNER_TEMP/tlahtolli-axolotl-source.csv" --limit 36 --audit-36
      - name: Evaluation audit (no invented accuracy)
        run: node tools/evaluate_translation_readiness.js
      - name: Source-evidenced finite verb clause hypotheses and safeguards
        run: node --check translator-sentence.js && node --check translator-grammar-ir.js && node --check translator-integrated.js && node tools/test_source_finite_context.js
      - name: General bounded historical grammar windows and graph evidence
        run: node tools/test_partial_grammar_spans.js
      - name: Sourced noun coordination and historical spelling refusal
        run: node --check translator-sentence.js && node --check translator-grammar-ir.js && node --check translator-integrated.js && node tools/test_nominal_coordination.js
      - name: Coordinated subject number and grammar-IR evidence safeguards
        run: node tools/test_coordinated_subject_agreement.js
      - name: Historical edited-excerpt sentence diagnostics (not accuracy)
        run: node --check tools/diagnose_historical_sentences.js && node tools/test_historical_sentence_diagnostics.js && node tools/diagnose_historical_sentences.js
